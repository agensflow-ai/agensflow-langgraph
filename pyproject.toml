[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agensflow-langgraph"
version = "0.1.1"
description = "AgensFlow adapter for LangGraph — decorator-based routing across a declared model pool"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Nicole Koenigstein" }]
keywords = ["langgraph", "langchain", "llm", "routing", "multi-agent", "bandits"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "pydantic>=2.5",
    "httpx>=0.27",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
]
judge-openrouter = [
    # No extra deps — httpx already suffices for the OpenRouter judge call.
]
langsmith = ["langsmith>=0.1"]

[project.urls]
Homepage = "https://github.com/nicolepcx/agensflow-langgraph"
Documentation = "https://github.com/nicolepcx/agensflow-langgraph#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/agensflow_langgraph"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
